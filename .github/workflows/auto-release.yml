name: Auto Release

# When work lands on main, read the top CHANGELOG version and, if it has no
# matching tag yet, create the tag `vX.Y.Z` and run the Release build for it.
#
# No PAT required: instead of relying on the tag push to trigger release.yml
# (GitHub blocks workflow-triggering-workflow with the default token), this
# workflow CALLS release.yml directly via workflow_call, passing the version.
# The same property means the tag push does not start a second release.

"on":
  push:
    branches:
      - main
    paths:
      - CHANGELOG.md # only a version bump can start a release

# Kept in step with the `release` job's block below — a called workflow cannot
# be granted more than its caller holds, and asking for more than that rejects
# the whole file before any job starts.
permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  detect:
    name: Detect new version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.ver.outputs.release }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 } # need all tags

      - name: Read top CHANGELOG version
        id: ver
        run: |
          # First versioned heading — skips "## [Unreleased]". The pre-release
          # suffix is part of the pattern: without it "## [0.2.0-rc.1]" would
          # be skipped and the NEXT heading down matched instead, which already
          # has a tag — so an rc merged to main would silently do nothing.
          VERSION="$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?\]' CHANGELOG.md \
                     | tr -d '## []')"
          if [ -z "$VERSION" ]; then
            echo "No versioned CHANGELOG entry found — nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists — skipping."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version detected: v$VERSION"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # BEFORE the tag is pushed: a CHANGELOG bumped without build.zig.zon
      # stops here, with nothing published and no tag to clean up. A tag cut
      # first would ship a binary reporting the wrong version, or leave a tag
      # with no release behind it.
      - name: Check the version is consistent
        if: steps.ver.outputs.release == 'true'
        run: sh .github/scripts/check-version.sh "${{ steps.ver.outputs.version }}"

      - name: Create and push tag
        if: steps.ver.outputs.release == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

  release:
    name: Build & publish
    needs: detect
    if: needs.detect.outputs.release == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.detect.outputs.version }}

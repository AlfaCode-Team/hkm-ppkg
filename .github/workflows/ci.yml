name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first: this suite is fast, and a
# queue of superseded runs only delays the one whose result anyone wants.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ── JOB NAMES ARE LOAD-BEARING ───────────────────────────────────────────────
# `test (ubuntu-latest)`, `test (macos-latest)` and `cross-compile` are the
# REQUIRED status checks on `main` (.github/scripts/protect-main.sh), and
# protection is enforced for admins too. Rename a job and every pull request
# waits forever for a check nothing reports, with no one able to override it.
# A rename must update protect-main.sh in the same change, applied after merge.

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both, deliberately. This package spends its time in path handling,
        # file permissions and atomic renames — the three areas where a macOS
        # and a Linux result differ for reasons the code did not intend.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # The pin is a RELEASED Zig, not a dev build, so it stays fetchable and a
      # fork PR needs no repository configuration to be green. The kernel that
      # consumes this package pins a dev build of its own; that is its concern,
      # and `minimum_zig_version` in build.zig.zon is the contract between them.
      - name: Read the pinned Zig version
        id: zig
        run: echo "version=$(cat .zig-version)" >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}

      - name: Check formatting
        run: zig fmt --check build.zig src app

      - name: Test
        # Includes the differential corpora recorded from Composer itself. If
        # this suite is green and no corpus was regenerated, the behaviour
        # still agrees with Composer.
        run: zig build test --summary all

      # The binary a release ships, built and actually RUN — a unit suite can
      # be green while the executable fails at startup.
      - name: Build and run ppkg
        run: |
          zig build
          ./zig-out/bin/ppkg --version
          ./zig-out/bin/ppkg about
          dir="$(mktemp -d)"
          (cd "$dir" && "$GITHUB_WORKSPACE/zig-out/bin/ppkg" init --name acme/ci </dev/null \
                     && "$GITHUB_WORKSPACE/zig-out/bin/ppkg" validate)

      - name: Lint the release scripts
        if: runner.os == 'Linux'
        # shellcheck ships on the ubuntu image. The installers run on machines
        # nobody here controls, as `curl | sh`; a quoting bug there is a bug
        # on somebody else's computer.
        run: shellcheck install.sh .github/scripts/*.sh

  # Every target a release ships, compiled on every pull request — from the
  # SAME list the release packages (.github/targets.txt), so a platform cannot
  # be released without having been compiled here first. A compile error behind
  # an `if (builtin.os.tag == .windows)` branch is invisible on a native build.
  #
  # Debug, compile-only: the release builds ReleaseSafe, but optimisation does
  # not change what compiles, and it is most of the wall time.
  cross:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned Zig version
        id: zig
        run: echo "version=$(cat .zig-version)" >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}

      - name: Compile for every shipped target
        run: |
          set -eu
          grep -Ev '^[[:space:]]*(#|$)' .github/targets.txt | while read -r target name cpu; do
            echo "── $name ($target${cpu:+, cpu $cpu})"
            zig build check -Dtarget="$target" ${cpu:+-Dcpu="$cpu"}
          done
